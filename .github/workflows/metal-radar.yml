name: Metal Radar

on:
  schedule:
    # Friday 01:00 Europe/Rome (CEST) = Thursday 23:00 UTC
    - cron: '0 23 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Rome
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
      # Optional: enables Claude extraction of releases, scores and standout tracks.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python src/metal_radar.py
      - name: Commit history and report
        run: |
          git config user.name 'metal-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/history.json data/latest-report.md data/editorial-picks.json
          git diff --cached --quiet || git commit -m 'Update Metal Radar'
          git push
